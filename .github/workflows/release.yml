name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 串行执行，避免两次提交并发时算出同一个版本号。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: 全量测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt 检查
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "以下文件未按 gofmt 格式化："
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  package:
    name: 构建 exe / msi
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # WiX 5 基于 .NET 6 运行，显式安装对应运行时避免依赖 runner 镜像。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $ver = ""
          if ($ref -match '^v(\d+\.\d+\.\d+)$') {
            # 手动推送的版本 tag 优先
            $ver = $Matches[1]
          } else {
            # 同一提交重复运行时复用已有版本 tag
            $existing = git tag -l 'v*' --points-at HEAD |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Select-Object -First 1
            if ($existing) {
              $ver = $existing.Substring(1)
            } else {
              $match = Select-String -Path engine/db.go -Pattern 'Version\s*=\s*"(\d+\.\d+\.\d+)"' | Select-Object -First 1
              $code = if ($match) { [version]$match.Matches[0].Groups[1].Value } else { [version]"0.1.0" }
              $latestTag = git tag -l 'v*' --merged HEAD --sort=-v:refname |
                Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                Select-Object -First 1
              if ($latestTag) {
                $latest = [version]$latestTag.Substring(1)
                if ($code -gt $latest) {
                  $ver = $code.ToString()
                } else {
                  # 每次提交自动递增 patch 版本
                  $ver = "{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
                }
              } else {
                $ver = $code.ToString()
              }
            }
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "构建版本: $ver"

      - name: 构建 exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, packaging | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/nanodb.exe ./cmd/nanodb
          Copy-Item dist/nanodb.exe packaging/nanodb.exe -Force
          ./dist/nanodb.exe help | Out-Null

      - name: 构建 msi
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build -arch x64 `
            -d Version=${{ steps.version.outputs.version }} `
            -bindpath packaging `
            -o dist/nanodb-windows-amd64.msi `
            packaging/NanoDB.wxs

      - uses: actions/upload-artifact@v4
        with:
          name: nanodb-windows-amd64
          path: |
            dist/nanodb.exe
            dist/nanodb-windows-amd64.msi
          if-no-files-found: error

  publish:
    name: 更新 tag 与发布
    needs: package
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: nanodb-windows-amd64
          path: dist

      # 分支提交（或手动触发）时，为本次构建打上 vX.Y.Z 语义版本 tag。
      # 由 tag 触发的运行本身已有 tag，无需重复创建。
      - name: 创建版本 tag
        if: github.ref_type == 'branch'
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Host "tag $tag 已存在，跳过创建"
          } else {
            git tag $tag
            git push origin "refs/tags/$tag"
            Write-Host "已创建并推送 tag $tag"
          }

      - name: 发布版本
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $exe = "dist/nanodb-$env:VERSION-windows-amd64.exe"
          $msi = "dist/nanodb-$env:VERSION-windows-amd64.msi"
          if (-not (Test-Path $exe)) { Rename-Item dist/nanodb.exe $exe }
          if (-not (Test-Path $msi)) { Rename-Item dist/nanodb-windows-amd64.msi $msi }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $notes = "NanoDB $tag`n`n对应提交: ${{ github.sha }}"
            gh release create $tag --verify-tag --title "NanoDB $tag" --notes $notes
          }
          gh release upload $tag $exe $msi --clobber
